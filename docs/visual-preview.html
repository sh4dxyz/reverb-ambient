<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Horizon Noir – aperçu visuel</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#eae6ff;--dim:#c9c2ee99;--bg:#05040a}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Rajdhani,sans-serif}
#wrap{position:relative;width:100%;max-width:1100px;margin:0 auto;aspect-ratio:1.6}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.title{position:absolute;left:4%;top:5%;font-family:Syncopate,sans-serif;font-size:clamp(16px,3vw,30px);letter-spacing:.18em;pointer-events:none}
.sub{position:absolute;left:4%;top:13%;font-size:clamp(10px,1.4vw,14px);color:var(--dim);letter-spacing:.08em;pointer-events:none}
#panel{max-width:1100px;margin:0 auto;padding:14px 16px 28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 18px}
label{display:flex;flex-direction:column;font-size:14px;letter-spacing:.08em;color:var(--dim)}
input[type=range]{accent-color:#ff3d9a}
button{font-family:Syncopate,sans-serif;font-size:13px;letter-spacing:.15em;padding:10px;border-radius:30px;border:1px solid #ffffff40;background:#1a1030;color:#eae6ff;cursor:pointer}
button.on{background:#000;color:#ffd89a;border-color:#ffd89a;box-shadow:0 0 18px #ffb35c88}
p.note{max-width:1100px;margin:0 auto;padding:0 16px 24px;color:var(--dim);font-size:14px}
</style></head><body>
<div id="wrap"><canvas id="c"></canvas><div class="title">HORIZON NOIR</div><div class="sub">APERÇU DU FOND OPENGL · LE PLUGIN UTILISE CE MÊME SHADER</div></div>
<div id="panel">
<label>TAILLE<input id="size" type="range" min="0" max="1" step="0.01" value="0.75"></label>
<label>DURÉE<input id="decay" type="range" min="0" max="1" step="0.01" value="0.7"></label>
<label>SOMBRE / CLAIR<input id="tone" type="range" min="0" max="1" step="0.01" value="0.3"></label>
<label>SHIMMER<input id="shimmer" type="range" min="-1" max="1" step="0.0833" value="0"></label>
<label>NIVEAU SIMULÉ<input id="lvl" type="range" min="0" max="1" step="0.01" value="0.6"></label>
<button id="inf">INFINI</button>
</div>
<p class="note">Le son est simulé ici (pulsations aléatoires) : dans le plugin, la densité suit le niveau de la reverb, le cœur les graves et les étoiles les aigus. Clique dans l'image pour lancer une onde de choc.</p>
<script>
const VS=`attribute vec2 position;varying vec2 vUv;void main(){vUv=position*0.5+0.5;gl_Position=vec4(position,0.0,1.0);}`;
const FS=`precision highp float;

varying vec2 vUv;

uniform vec2  uRes;
uniform float uTime;
uniform float uLevel;    // overall wet level 0..1
uniform float uLow;      // low band energy 0..1
uniform float uHigh;     // high band energy 0..1
uniform float uInput;    // dry input level 0..1
uniform float uSize;     // Taille 0..1
uniform float uDecay;    // Duree 0..1
uniform float uTone;     // Sombre/Clair 0..1
uniform float uShimmer;  // -1..1
uniform float uDuck;     // Ducking 0..1
uniform float uInf;      // INFINI morph 0..1
uniform vec2  uMouse;    // pixels
uniform vec3  uRipple0;  // x, y (pixels), age (s)
uniform vec3  uRipple1;
uniform vec3  uRipple2;
uniform vec3  uRipple3;

float hash (vec2 p)
{
    p = fract (p * vec2 (123.34, 456.21));
    p += dot (p, p + 45.32);
    return fract (p.x * p.y);
}

float noise (vec2 p)
{
    vec2 i = floor (p);
    vec2 f = fract (p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix (mix (hash (i), hash (i + vec2 (1.0, 0.0)), u.x),
                mix (hash (i + vec2 (0.0, 1.0)), hash (i + vec2 (1.0, 1.0)), u.x), u.y);
}

float fbm (vec2 p)
{
    float v = 0.0;
    float a = 0.5;
    mat2 m = mat2 (1.6, 1.2, -1.2, 1.6);
    for (int i = 0; i < 5; ++i)
    {
        v += a * noise (p);
        p = m * p;
        a *= 0.5;
    }
    return v;
}

mat2 rot (float a)
{
    float c = cos (a);
    float s = sin (a);
    return mat2 (c, -s, s, c);
}

vec2 rippleWarp (vec2 p, vec3 rp, inout float glow)
{
    if (rp.z < 0.0 || rp.z > 3.0)
        return vec2 (0.0);
    vec2 c = (rp.xy - 0.5 * uRes) / uRes.y;
    vec2 d = p - c;
    float r = length (d);
    float front = rp.z * 0.55;
    float k = (r - front) * 16.0; // pow() is undefined for negative bases in GLSL
    float w = exp (-k * k) * (1.0 - rp.z / 3.0);
    glow += w;
    return d / max (r, 0.0001) * w * 0.035;
}

vec3 stars (vec2 q, float density, float twinkleBoost)
{
    vec3 acc = vec3 (0.0);
    for (int layer = 0; layer < 2; ++layer)
    {
        float fl = float (layer);
        vec2 g = q * (55.0 + fl * 70.0) + fl * 17.3;
        vec2 cell = floor (g);
        float h = hash (cell);
        if (h > density)
        {
            vec2 pos = vec2 (hash (cell + 3.1), hash (cell + 7.7));
            float d = length (fract (g) - pos);
            float tw = 0.6 + 0.4 * sin (uTime * (1.0 + h * 5.0) + h * 40.0);
            float b = smoothstep (0.09, 0.0, d) * tw * (0.5 + twinkleBoost);
            acc += mix (vec3 (0.75, 0.8, 1.0), vec3 (1.0, 0.8, 0.65), hash (cell + 1.9)) * b;
        }
    }
    return acc;
}

void main()
{
    vec2 frag = vUv * uRes;
    vec2 p = (frag - 0.5 * uRes) / uRes.y;
    float t = uTime;
    float inf = clamp (uInf, 0.0, 1.0);

    // Click ripples (visual only).
    float rippleGlow = 0.0;
    vec2 warp = rippleWarp (p, uRipple0, rippleGlow) + rippleWarp (p, uRipple1, rippleGlow)
              + rippleWarp (p, uRipple2, rippleGlow) + rippleWarp (p, uRipple3, rippleGlow);
    p += warp;

    // The cursor gently pulls the gas.
    vec2 m = (uMouse - 0.5 * uRes) / uRes.y;
    vec2 toM = m - p;
    p += toM * 0.04 * exp (-dot (toM, toM) * 6.0);

    float r = length (p);

    // INFINI: the nebula collapses into a black hole (lensing + swirl).
    float rs = inf * (0.085 + 0.05 * uSize);
    vec2 q = p;
    q *= 1.0 + inf * rs * rs * 2.2 / max (r * r, 0.0004);
    q = rot (inf * (1.6 / (r * 5.0 + 0.35)) + t * 0.12 * inf) * q;

    // Ducking breathes the cloud in when the dry signal plays.
    q *= 1.0 + uDuck * uInput * 0.25;

    float speed = mix (0.07, 0.018, uDecay) * (1.0 - 0.6 * inf);
    float scale = mix (2.8, 1.15, uSize);
    vec2 np = q * scale + vec2 (0.0, 0.2);

    vec2 w1 = vec2 (fbm (np + vec2 (0.0, t * speed)), fbm (np + vec2 (5.2, 1.3) - t * speed * 0.7));
    vec2 w2 = vec2 (fbm (np + 3.0 * w1 + vec2 (1.7, 9.2) + t * speed * 0.4),
                    fbm (np + 3.0 * w1 + vec2 (8.3, 2.8) - t * speed * 0.3));
    float n = fbm (np + 2.6 * w2);

    float dens = smoothstep (0.28, 0.95, n);
    dens *= 0.45 + 1.1 * exp (-dot (q, q) * 1.4);

    // Palette: Sombre = blood red / indigo, Clair = teal / amber.
    vec3 aDark = vec3 (0.42, 0.03, 0.12);
    vec3 bDark = vec3 (0.10, 0.03, 0.30);
    vec3 aBright = vec3 (0.10, 0.62, 0.80);
    vec3 bBright = vec3 (1.00, 0.58, 0.28);
    vec3 colA = mix (aDark, aBright, uTone);
    vec3 colB = mix (bDark, bBright, uTone);

    float energy = 0.55 + 2.4 * uLevel;
    vec3 col = mix (colB, colA, clamp (w2.x * 1.5 - 0.25, 0.0, 1.0)) * dens * energy;
    col += mix (vec3 (1.0, 0.35, 0.6), vec3 (0.65, 0.95, 1.0), uTone) * pow (dens, 3.0) * (0.35 + 3.0 * uHigh);

    // Pulsing core (follows the low end).
    float core = exp (-r * r * 16.0) * (0.12 + 1.9 * uLow);
    col += mix (vec3 (1.0, 0.45, 0.65), vec3 (0.8, 0.95, 1.0), uTone) * core * (1.0 - inf);

    // Lensed star field.
    col += stars (q * 0.8, 0.975, uHigh * 2.0) * (1.0 - 0.6 * dens);

    // Shimmer sparks: rising for +, falling for -.
    float sh = abs (uShimmer);
    if (sh > 0.01)
    {
        float dir = uShimmer > 0.0 ? 1.0 : -1.0;
        vec2 g = (q + vec2 (0.0, -dir * t * 0.09)) * 26.0;
        vec2 cell = floor (g);
        float h = hash (cell + 11.0);
        if (h > 0.94)
        {
            vec2 pos = vec2 (hash (cell + 2.0), hash (cell + 5.0));
            float d = length (fract (g) - pos);
            float flick = 0.5 + 0.5 * sin (t * 9.0 + h * 60.0);
            col += mix (vec3 (0.7, 0.85, 1.0), vec3 (1.0, 0.85, 0.5), uTone) * smoothstep (0.12, 0.0, d) * flick * sh * (0.6 + 2.0 * uLevel);
        }
    }

    if (inf > 0.001)
    {
        // Horizon swallows everything behind it.
        float horizon = smoothstep (rs * 0.96, rs * 1.04, r);
        col *= mix (1.0, horizon, inf);

        // Tilted accretion disk with streaks.
        vec2 dp = p;
        dp.y *= 3.4;
        float dr = length (dp);
        float ang = atan (dp.y, dp.x);
        float disk = smoothstep (rs * 1.3, rs * 2.0, dr) * (1.0 - smoothstep (rs * 2.2, rs * 5.5, dr));
        float streak = 0.5 + 0.5 * sin (ang * 6.0 - t * 2.6 + fbm (vec2 (dr * 14.0, ang * 2.0 - t * 0.8)) * 7.0);
        vec3 diskCol = mix (vec3 (1.0, 0.36, 0.10), vec3 (1.0, 0.92, 0.75), streak);
        float front = dp.y < 0.0 ? 1.0 : horizon;
        col += diskCol * disk * (0.35 + streak) * front * inf * (0.9 + 2.2 * uLevel);

        // Photon ring.
        float rk = (r - rs * 1.12) / (rs * 0.07 + 0.002);
        float ring = exp (-rk * rk);
        col += vec3 (1.0, 0.86, 0.62) * ring * 1.6 * inf;
    }

    col += mix (vec3 (0.9, 0.5, 1.0), vec3 (0.6, 1.0, 1.0), uTone) * rippleGlow * 0.5;

    // Tone map, vignette, dither.
    col = vec3 (1.0) - exp (-col * 1.25);
    float vig = smoothstep (1.25, 0.25, length (p * vec2 (0.85, 1.05)));
    col *= 0.25 + 0.75 * vig;
    col = pow (col, vec3 (0.92));
    col += (hash (frag + fract (t) * 100.0) - 0.5) / 255.0;

    gl_FragColor = vec4 (col, 1.0);
}
`;
const c=document.getElementById('c');const gl=c.getContext('webgl',{antialias:false});
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o}
const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(p);
if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(p));
gl.useProgram(p);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(p,'position');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(p,n);const $=id=>document.getElementById(id);
let inf=false,infM=0,lvl=0,low=0,high=0,mouse=[-1e4,-1e4];const rip=[[0,0,-9],[0,0,-9],[0,0,-9],[0,0,-9]];let ri=0;
const params=new URLSearchParams(location.search);if(params.get('inf')==='1'){inf=true;infM=1;$('inf').classList.add('on')}
$('inf').onclick=()=>{inf=!inf;$('inf').classList.toggle('on',inf)};
c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();mouse=[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]});
c.addEventListener('mouseleave',()=>mouse=[-1e4,-1e4]);
c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();rip[ri++%4]=[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,performance.now()]});
const t0=performance.now();let last=t0,pulse=0;
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;
 const dpr=Math.min(2,devicePixelRatio||1);const w=c.clientWidth*dpr|0,h=c.clientHeight*dpr|0;if(c.width!==w||c.height!==h){c.width=w;c.height=h}
 gl.viewport(0,0,w,h);
 if(Math.random()<dt*1.2)pulse=1;pulse*=Math.exp(-dt*1.4);
 const L=+$('lvl').value;const tl=L*(0.55+0.45*pulse);lvl+=(tl-lvl)*Math.min(1,dt*6);low+=(L*(0.4+0.6*pulse)-low)*Math.min(1,dt*5);high+=(L*0.8*pulse*pulse-high)*Math.min(1,dt*8);
 infM+=((inf?1:0)-infM)*Math.min(1,dt*1.6);
 const t=(now-t0)/1000;
 gl.uniform2f(U('uRes'),w,h);gl.uniform1f(U('uTime'),t);gl.uniform1f(U('uLevel'),lvl);gl.uniform1f(U('uLow'),low);gl.uniform1f(U('uHigh'),high);
 gl.uniform1f(U('uInput'),pulse*L);gl.uniform1f(U('uSize'),+$('size').value);gl.uniform1f(U('uDecay'),+$('decay').value);gl.uniform1f(U('uTone'),+$('tone').value);
 gl.uniform1f(U('uShimmer'),+$('shimmer').value);gl.uniform1f(U('uDuck'),0);gl.uniform1f(U('uInf'),infM);
 gl.uniform2f(U('uMouse'),mouse[0]*w,(1-mouse[1])*h);
 rip.forEach((r,i)=>gl.uniform3f(U('uRipple'+i),r[0]*w,(1-r[1])*h,r[2]<0?-1:(now-r[2])/1000));
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
